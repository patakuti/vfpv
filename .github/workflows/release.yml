name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6

    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/
          ln -s /root/.local/share/godot/export_templates/4.6.stable \
                /github/home/.local/share/godot/export_templates/4.6.stable

      - name: Setup export directories
        run: |
          mkdir -p build/linux build/windows build/Web build/android

      - name: Import project
        run: godot --headless --import 2>&1 || true

      - name: Export Linux
        run: godot --headless --export-release "Linux" build/linux/vfpv.x86_64

      - name: Export Windows
        run: godot --headless --export-release "Windows Desktop" build/windows/vfpv.exe

      - name: Export Web
        run: godot --headless --export-release "Web" build/Web/index.html

      - name: Setup Android build
        run: |
          # HOME is /github/home in Actions, so copy the image's editor settings
          # (which hold the Android/Java SDK paths) into it. Copy rather than
          # symlink: the import step has already created this directory.
          mkdir -p /github/home/.config/godot
          cp -rf /root/.config/godot/. /github/home/.config/godot/
          # android/ is gitignored, so generate the gradle build template here
          mkdir -p android/build
          unzip -q /root/.local/share/godot/export_templates/4.6.stable/android_source.zip -d android/build
          echo "4.6.stable" > android/.build_version
          # Decode the release keystore (kept in GitHub Secrets, never committed)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Derive the app version from the tag (v0.3.0 -> 0.3.0); version code is monotonic
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s|^version/name=.*|version/name=\"${VERSION}\"|" export_presets.cfg
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" export_presets.cfg
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Export Android
        run: godot --headless --export-release "Android" build/android/vfpv-android.apk
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Package Linux
        run: |
          cd build/linux
          zip ../../vfpv-linux-x86_64.zip vfpv.x86_64

      - name: Package Windows
        run: |
          cd build/windows
          zip ../../vfpv-windows-x86_64.zip vfpv.exe

      - name: Package Web
        run: |
          cd build
          zip -r ../vfpv-web.zip Web

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vfpv-linux-x86_64.zip
            vfpv-windows-x86_64.zip
            vfpv-web.zip
            build/android/vfpv-android.apk
          generate_release_notes: true
